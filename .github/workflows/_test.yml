name: test

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: "From which folder this pipeline executes"
      candidate-sha:
        required: true
        type: string
        description: "Exact commit to build and attach package artifacts for"

jobs:
  build:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    continue-on-error: ${{ matrix.experimental }}
    name: "make test #${{ matrix.python-version }}"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ inputs.working-directory }}/uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        shell: bash
        run: uv sync --frozen

      - name: Run core tests
        shell: bash
        run: |
          make test

      - name: Ensure the tests did not create any additional files
        shell: bash
        run: |
          set -eu

          STATUS="$(git status)"
          echo "$STATUS"

          # grep will exit non-zero if the target message isn't found,
          # and `set -e` above will cause the step to fail.
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  core-compatibility:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core_label: minimum
            core_spec: langchain-core==1.2.22
          - core_label: latest
            core_spec: langchain-core>=1.2.22,<2

    name: "core ${{ matrix.core_label }}"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ inputs.working-directory }}/uv.lock"

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install locked dependencies
        shell: bash
        run: uv sync --frozen

      - name: Select ${{ matrix.core_label }} LangChain Core
        shell: bash
        run: |
          uv pip install \
            --python .venv/bin/python \
            --upgrade \
            "${{ matrix.core_spec }}"
          uv run --no-sync python -c \
            "import importlib.metadata; print(importlib.metadata.version('langchain-core'))"

      - name: Run unit suite against ${{ matrix.core_label }} Core
        shell: bash
        run: |
          uv run --no-sync pytest tests/unit_tests/ --cov-fail-under=90

  agent-contract:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    name: "LangChain Agent 1.3.14"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ inputs.working-directory }}/uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies
        shell: bash
        run: uv sync --frozen

      - name: Install pinned LangChain Agent environment
        shell: bash
        run: |
          uv pip install \
            --python .venv/bin/python \
            "langchain==1.3.14"
          uv run --no-sync python -c \
            "import importlib.metadata; assert importlib.metadata.version('langchain') == '1.3.14'"

      - name: Run hosted Agent contracts
        shell: bash
        run: |
          uv run --no-sync pytest \
            tests/unit_tests/chat_models/primary/test_wrapper_hardening.py \
            -k create_agent \
            --no-cov

  package-artifacts:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    name: "wheel and sdist"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate-sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv build
          sha256sum dist/*

      - name: Verify clean artifact installs and SDK resources
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            artifact_path="$(realpath "$artifact")"
            environment="$(mktemp -d)"
            uv venv --python 3.12 "$environment"
            uv pip install \
              --python "$environment/bin/python" \
              "$artifact_path" \
              "gigachat==0.2.3" \
              "langchain-core==1.2.22"
            (
              cd "$environment"
              bin/python - <<'PY'
          from importlib.metadata import requires, version

          import gigachat
          import langchain_gigachat
          from langchain_gigachat import GigaChat, GigaChatEmbeddings
          from packaging.requirements import Requirement

          installed_requirements = {
              requirement.name: requirement
              for raw_requirement in requires("langchain-gigachat") or []
              if (requirement := Requirement(raw_requirement)).marker is None
              or requirement.marker.evaluate()
          }
          sdk_requirement = installed_requirements["gigachat"]
          core_requirement = installed_requirements["langchain-core"]
          assert {str(item) for item in sdk_requirement.specifier} == {
              ">=0.2.3",
              "<0.3",
          }
          assert {str(item) for item in core_requirement.specifier} == {
              ">=1.2.22",
              "<2",
          }
          assert version("gigachat") == "0.2.3"
          assert version("langchain-core") == "1.2.22"
          assert langchain_gigachat.GigaChat is GigaChat
          assert langchain_gigachat.GigaChatEmbeddings is GigaChatEmbeddings

          client = gigachat.GigaChat()
          assert callable(client.chat.create)
          assert callable(client.chat.stream)
          assert callable(client.achat.create)
          assert callable(client.achat.stream)
          print(
              "verified",
              version("langchain-gigachat"),
              version("langchain-core"),
              version("gigachat"),
          )
          PY
            )
          done

      - name: Upload exact-head artifacts
        uses: actions/upload-artifact@v4
        with:
          name: langchain-gigachat-${{ inputs.candidate-sha }}
          path: ${{ inputs.working-directory }}/dist/*
          if-no-files-found: error
