name: test

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: "From which folder this pipeline executes"

jobs:
  build:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    continue-on-error: ${{ matrix.experimental }}
    name: "make test #${{ matrix.python-version }}"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ inputs.working-directory }}/uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        shell: bash
        run: uv sync --frozen

      - name: Run core tests
        shell: bash
        run: |
          make test

      - name: Ensure the tests did not create any additional files
        shell: bash
        run: |
          set -eu

          STATUS="$(git status)"
          echo "$STATUS"

          # grep will exit non-zero if the target message isn't found,
          # and `set -e` above will cause the step to fail.
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  core-compatibility:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core_label: minimum
            core_spec: langchain-core==1.2.0
          - core_label: latest
            core_spec: langchain-core>=1.2,<2

    name: "core ${{ matrix.core_label }}"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ inputs.working-directory }}/uv.lock"

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install locked dependencies
        shell: bash
        run: uv sync --frozen

      - name: Select ${{ matrix.core_label }} LangChain Core
        shell: bash
        run: |
          uv pip install \
            --python .venv/bin/python \
            --upgrade \
            "${{ matrix.core_spec }}"
          uv run --no-sync python -c \
            "import importlib.metadata; print(importlib.metadata.version('langchain-core'))"

      - name: Run unit suite against ${{ matrix.core_label }} Core
        shell: bash
        run: |
          uv run --no-sync pytest tests/unit_tests/ --cov-fail-under=90

  agent-contract:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    name: "LangChain Agent 1.3.14"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ inputs.working-directory }}/uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies
        shell: bash
        run: uv sync --frozen

      - name: Install pinned LangChain Agent environment
        shell: bash
        run: |
          uv pip install \
            --python .venv/bin/python \
            "langchain==1.3.14"
          uv run --no-sync python -c \
            "import importlib.metadata; assert importlib.metadata.version('langchain') == '1.3.14'"

      - name: Run hosted Agent contracts
        shell: bash
        run: |
          uv run --no-sync pytest \
            tests/unit_tests/chat_models/primary/test_wrapper_hardening.py \
            -k create_agent \
            --no-cov
